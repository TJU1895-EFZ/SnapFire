name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build renderer/main/preload
        run: npm run build

      - name: Build portable zip
        run: npx electron-builder --win --x64 --publish never

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release
          sha256sum *.zip | sed -E 's/^([0-9a-f]+) [ *](.+)$/\1  \2/' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapFire-portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          # 0.x and suffixed tags (v1.0.0-rc.1, -beta.1) are pre-releases.
          # v1.0.0 and later plain tags are published as latest.
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          if [[ "$TAG" == *-* || ! "$MAJOR" =~ ^[0-9]+$ || "$MAJOR" -lt 1 ]]; then
            RELEASE_TITLE="SnapFire ${TAG} 测试版"
            RELEASE_ARGS=(--prerelease)
          else
            RELEASE_TITLE="SnapFire ${TAG}"
            RELEASE_ARGS=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" \
              --title "$RELEASE_TITLE" \
              "${RELEASE_ARGS[@]}"
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
            fi
          else
            gh release create "$TAG" release/*.zip release/SHA256SUMS.txt \
              --title "$RELEASE_TITLE" \
              "${RELEASE_ARGS[@]}" \
              "${NOTES_ARGS[@]}"
          fi
